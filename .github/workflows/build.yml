name: Build Eden TH

# Builds the Android app from the OFFICIAL Eden source (git.eden-emu.dev), with the personal changes
# in patches/apply.py, and publishes the APK as a release of this repository. Nothing prebuilt is
# downloaded for the app itself: the runner compiles it.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Eden commit, tag or branch to build (official repository)"
        default: master
        required: true
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: eden-th
  cancel-in-progress: true

env:
  EDEN_REPO: https://git.eden-emu.dev/eden-emu/eden.git

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Clone the official Eden source
        id: eden
        run: |
          set -euo pipefail
          ref="${{ github.event.inputs.ref || 'master' }}"
          git clone --recursive "$EDEN_REPO" eden
          cd eden
          git checkout "$ref"
          git submodule update --init --recursive
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=10 HEAD)" >> "$GITHUB_OUTPUT"
          git log -1 --format='Eden %H (%cd): %s' | tee -a "$RUNNER_TEMP/ci-log.txt"

      - name: Apply the Eden TH changes
        run: python3 patches/apply.py eden 2>&1 | tee -a "$RUNNER_TEMP/ci-log.txt"; exit ${PIPESTATUS[0]}
        shell: bash

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK packages Eden asks for
        run: |
          set -euo pipefail
          gradle=eden/src/android/app/build.gradle.kts
          ndk=$(sed -n 's/.*ndkVersion = "\([^"]*\)".*/\1/p' "$gradle" | head -1)
          sdk=$(sed -n 's/.*compileSdkVersion = "android-\([0-9]*\)".*/\1/p' "$gradle" | head -1)
          echo "NDK $ndk, platform $sdk"
          echo "NDK $ndk, platform ${sdk:-36}" >> "$RUNNER_TEMP/ci-log.txt"
          # `yes` dies of SIGPIPE when sdkmanager stops reading; that must not fail the step.
          { yes || true; } | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;$ndk" "platforms;android-${sdk:-36}" "cmake;3.22.1" > "$RUNNER_TEMP/sdk-log.txt" 2>&1 \
            || { tail -40 "$RUNNER_TEMP/sdk-log.txt" | tee -a "$RUNNER_TEMP/ci-log.txt"; exit 1; }
          ls "$ANDROID_HOME/ndk" | tee -a "$RUNNER_TEMP/ci-log.txt"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Build
        working-directory: eden
        run: |
          set -euo pipefail
          sudo apt-get update -q && sudo apt-get install -y -q glslang-tools ninja-build > /dev/null || true
          # Mainline flavour, Release, no update checker (this app is updated from here, not upstream).
          sh .ci/android/build.sh -t standard -b Release > "$RUNNER_TEMP/build-log.txt" 2>&1 || { tail -300 "$RUNNER_TEMP/build-log.txt" | tee -a "$RUNNER_TEMP/ci-log.txt"; exit 1; }
          ls -l artifacts

      - name: Publish the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=$(ls eden/artifacts/*.apk | head -1)
          name="Eden-TH-${{ steps.eden.outputs.short }}.apk"
          cp "$apk" "$name"
          cp "$apk" Eden-TH.apk
          sha256sum "$name" | tee "$name.sha256"
          gh release delete latest -R "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest "$name" Eden-TH.apk "$name.sha256" -R "$GITHUB_REPOSITORY" \
            --title "Eden TH (${{ steps.eden.outputs.short }})" \
            --notes "Built from the official Eden source at ${{ steps.eden.outputs.sha }} with patches/apply.py."

      # The repository's own CI log, readable with plain git: what the patch step saw and the end of a
      # failed build, pushed to the ci-logs branch.
      - name: Publish the CI log
        if: always()
        run: |
          set +e
          log="$RUNNER_TEMP/ci-log.txt"
          {
            echo "== run ${{ github.run_id }} on ${{ github.sha }}"
            if [ -d eden ]; then
              echo "== gradle mainline flavour"
              grep -n -A8 'create("mainline")' eden/src/android/app/build.gradle.kts
              echo "== applicationId lines"
              grep -n 'applicationId' eden/src/android/app/build.gradle.kts
              echo "== kgsl / custom driver checks"
              grep -rn -B3 -A6 'kgsl-3d0' eden/src/android/app/src/main/jni/ | head -80
            fi
          } >> "$log"
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-logs-tmp
          git rm -rq --cached . ; cp "$log" ci-log.txt
          git add ci-log.txt; git commit -qm "CI log ${{ github.run_id }}"
          git push -f origin HEAD:ci-logs
