name: Build Eden TH

# Builds the Android app from the OFFICIAL Eden source (git.eden-emu.dev), with the personal changes
# in patches/apply.py, and publishes the APK as a release of this repository. Nothing prebuilt is
# downloaded for the app itself: the runner compiles it.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Eden commit, tag or branch to build (official repository)"
        default: master
        required: true
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: eden-th
  cancel-in-progress: true

env:
  EDEN_REPO: https://git.eden-emu.dev/eden-emu/eden.git

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Clone the official Eden source
        id: eden
        run: |
          set -euo pipefail
          ref="${{ github.event.inputs.ref || 'master' }}"
          git clone --recursive "$EDEN_REPO" eden
          cd eden
          git checkout "$ref"
          git submodule update --init --recursive
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=10 HEAD)" >> "$GITHUB_OUTPUT"
          git log -1 --format='Eden %H (%cd): %s'

      - name: Apply the Eden TH changes
        run: python3 patches/apply.py eden

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK packages Eden asks for
        run: |
          set -euo pipefail
          gradle=eden/src/android/app/build.gradle.kts
          ndk=$(sed -n 's/.*ndkVersion = "\([^"]*\)".*/\1/p' "$gradle" | head -1)
          sdk=$(sed -n 's/.*compileSdkVersion = "android-\([0-9]*\)".*/\1/p' "$gradle" | head -1)
          echo "NDK $ndk, platform $sdk"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;$ndk" "platforms;android-${sdk:-36}" "cmake;3.22.1" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Build
        working-directory: eden
        run: |
          set -euo pipefail
          sudo apt-get update -q && sudo apt-get install -y -q glslang-tools ninja-build > /dev/null || true
          # Mainline flavour, Release, no update checker (this app is updated from here, not upstream).
          sh .ci/android/build.sh -t standard -b Release
          ls -l artifacts

      - name: Publish the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=$(ls eden/artifacts/*.apk | head -1)
          name="Eden-TH-${{ steps.eden.outputs.short }}.apk"
          cp "$apk" "$name"
          cp "$apk" Eden-TH.apk
          sha256sum "$name" | tee "$name.sha256"
          gh release delete latest -R "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest "$name" Eden-TH.apk "$name.sha256" -R "$GITHUB_REPOSITORY" \
            --title "Eden TH (${{ steps.eden.outputs.short }})" \
            --notes "Built from the official Eden source at ${{ steps.eden.outputs.sha }} with patches/apply.py."
